<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer une personne</title>
</head>
<body>

    <h1>Créer une personne</h1>

    <form method="post">
        {% csrf_token %}
    <p>
        <label for="first_name">Prénom :</label><br>
        <input id="first_name" name="first_name" placeholder="Prénom">
    </p>

    <p>
        <label for="last_name">Nom :</label><br>
        <input id="last_name" name="last_name" placeholder="Nom">
    </p>

        <button type="submit">Créer</button>
    </form>

    <p>
        <a href="{% url 'person_list' %}">&laquo; Retour à la liste</a>
    </p>

</body>
</html>
